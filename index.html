
<script>
const form = document.getElementById('planForm');
const statusEl = document.getElementById('status');
let lastText = '';

const API_URL = 'https://ireland-life-admin-api.loveforever020607-9c0.workers.dev/api/plan';

const fallback = {
  childcare: {
    title: 'Childcare support',
    steps: [
      ['Review the National Childcare Scheme (NCS)', 'Read the current official guidance and check which scheme and conditions may apply.'],
      ['Contact your childcare provider', 'Ask whether the provider participates in NCS and how a subsidy is applied.'],
      ['Prepare the information requested', 'Use the official checklist to identify the parent, child and household details needed.'],
      ['Check before submitting', 'Review the application instructions and confirm any deadlines directly with the scheme.']
    ],
    links: [
      ['National Childcare Scheme', 'https://www.ncs.gov.ie/'],
      ['Citizens Information: Childcare', 'https://www.citizensinformation.ie/en/education/pre-school-education-and-childcare/']
    ]
  },
  benefits: {
    title: 'Family benefits and financial support',
    steps: [
      ['Identify the payment you want to understand', 'Start with one specific payment or support scheme.'],
      ['Review the current eligibility conditions', 'Check the official rules; do not assume that a family circumstance guarantees eligibility.'],
      ['Prepare the information requested', 'Use the official guidance to identify relevant information and supporting documents.'],
      ['Confirm rates and application steps', 'Check current rates, deadlines and instructions with the responsible authority.']
    ],
    links: [
      ['Department of Social Protection', 'https://www.gov.ie/en/department-of-social-protection/'],
      ['Citizens Information: Social welfare', 'https://www.citizensinformation.ie/en/social-welfare/']
    ]
  },
  paperwork: {
    title: 'Family paperwork',
    steps: [
      ['Define the task and desired outcome', 'Identify which service or organisation you need to contact.'],
      ['Check the official document requirements', 'Confirm the current forms, identification and supporting documents required.'],
      ['Make a missing-documents list', 'Separate documents you already have from items you still need to obtain.'],
      ['Verify submission method and deadline', 'Use the official channel and keep a record of any confirmation.']
    ],
    links: [
      ['Citizens Information', 'https://www.citizensinformation.ie/'],
      ['Government of Ireland', 'https://www.gov.ie/']
    ]
  }
};

function selected(name) {
  return form.querySelector(`[name="${name}"]:checked`)?.value || '';
}

function safe(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function render(data, topic) {
  const r = document.getElementById('result');
  const defaults = fallback[topic];
  const steps = Array.isArray(data.steps) ? data.steps : defaults.steps;
  const links = Array.isArray(data.links) ? data.links : defaults.links;

  r.innerHTML = `
    <h2>${safe(data.title || defaults.title)}</h2>
    <p>${safe(data.summary || 'Use this checklist as a starting point. Verify current requirements with the official sources below.')}</p>
    <h3>Recommended next steps</h3>
    <ol class="checklist">
      ${steps.map(s => `
        <li>
          <label>
            <input type="checkbox">
            <b>${safe(s.title || s[0] || 'Next step')}</b><br>
            ${safe(s.description || s[1] || '')}
          </label>
        </li>
      `).join('')}
    </ol>
    <h3>Official resources</h3>
    <div class="links">
      ${links.map(l => `
        <a href="${safe(l.url || l[1])}" target="_blank" rel="noopener noreferrer">
          ${safe(l.title || l[0])} ↗
        </a>
      `).join('')}
    </div>
    <p class="status">AI-assisted guidance is a starting point, not an eligibility decision.</p>
  `;

  lastText =
    (data.title || defaults.title) + '\n\n' +
    steps.map((s, i) =>
      `${i + 1}. ${s.title || s[0]} — ${s.description || s[1]}`
    ).join('\n') +
    '\n\nOfficial links:\n' +
    links.map(l => `${l.title || l[0]}: ${l.url || l[1]}`).join('\n');
}

form.addEventListener('submit', async e => {
  e.preventDefault();

  const topic = selected('topic');
  const payload = {
    topic,
    family: selected('family'),
    childAge: selected('age'),
    stage: selected('stage'),
    details: form.elements.details.value.trim()
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  statusEl.textContent = 'Connecting to AI…';

  try {
    // This is the corrected connection to your Cloudflare Worker.
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || `Request failed (${res.status})`);
    }

    render(data, topic);

    statusEl.textContent = data.aiPowered
      ? 'Generated with AI. Verify all details using official sources.'
      : 'The response was returned without AI confirmation.';

  } catch (err) {
    render(fallback[topic], topic);
    statusEl.textContent =
      'AI connection failed: ' + (err.message || 'Please try again.');
  }

  document.getElementById('formPanel').classList.add('hidden');
  document.getElementById('resultPanel').classList.remove('hidden');
  btn.disabled = false;
});

document.getElementById('backBtn').onclick = () => {
  document.getElementById('resultPanel').classList.add('hidden');
  document.getElementById('formPanel').classList.remove('hidden');
};

document.getElementById('copyBtn').onclick = async () => {
  try {
    await navigator.clipboard.writeText(lastText);
    document.getElementById('copyBtn').textContent = 'Copied!';
  } catch (e) {
    alert(lastText);
  }
};
</script>
